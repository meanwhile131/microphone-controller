name: Release

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pipenv
      - name: Install dependencies
        run: |
          python -m pip install pipenv
          pipenv sync --dev
      - name: Build executable
        run: pipenv run pyinstaller --onefile main.py
      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          name: main-${{ matrix.os }}
          path: dist/main/main*
  
  release:
    needs: build
    runs-on: ubuntu-slim
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: files
          merge-multiple: true
      - name: Release
        env:
          SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: gh release create --generate-notes ${SHA:0:7} files/*

